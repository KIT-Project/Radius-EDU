<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin">
<title>โรงเรียนหนองบัวเเดงวิทยา WIFI</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:#f0f4f8;font-family:system-ui,sans-serif;color:#17314f}.card{width:100%;max-width:420px;background:white;padding:36px;border-radius:20px;box-shadow:0 16px 50px #17314f12}.badge{display:grid;place-items:center;width:80px;height:80px;margin:0 auto}.badge img{display:block;width:80px;height:80px;object-fit:contain}h1{text-align:center}h1{font-size:22px;line-height:1.5;margin:20px 0 8px;text-wrap:balance}p{line-height:1.6;color:#5b6c80;margin:0 0 24px}label{display:block;font-size:14px;font-weight:600;margin:18px 0 8px}input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}input:focus{outline:3px solid #dbeafe;border-color:#2563eb}button{width:100%;margin-top:24px;padding:14px;border:0;border-radius:10px;background:#2563eb;color:white;font:inherit;font-weight:600;cursor:pointer}button:disabled{background:#94a3b8;cursor:not-allowed}.status{padding:12px;background:#f1f5f9;border-radius:10px;font-size:14px;margin:20px 0 0}.footer{text-align:center;font-size:12px;margin-top:24px;color:#64748b}
</style>
<script src="portal-config.js?v=4" defer></script><script src="js/schoolPortal.js?v=4" defer></script>
</head>
<body><main class="card"><div class="badge"><img src="images/logo-edu.jpg" alt="โลโก้โรงเรียนหนองบัวเเดงวิทยา" width="80" height="80"></div>
<h1 id="schoolName">โรงเรียนหนองบัวเเดงวิทยา WIFI</h1>
<form id="loginForm" method="post" autocomplete="on">
<input type="hidden" name="magic" id="magic">
<label for="username">ชื่อผู้ใช้</label><input id="username" name="username" autocomplete="username" required maxlength="253">
<label for="password">รหัสผ่าน</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<button id="submitButton" type="submit" disabled>เข้าสู่ระบบ</button>
</form><p id="status" class="status" role="status">กำลังตรวจสอบการเชื่อมต่อ…</p>
<div class="footer">สำหรับนักเรียนและบุคลากรของโรงเรียน</div></main></body></html>
