# Dedicated static captive portal listener; admin and API remain on port 80.
server {
    absolute_redirect off;
    listen 550;
    listen [::]:550;
    server_name _;
    root /var/www/html;
    index index.html;

    location = / { return 302 /login/bootstrap5/$is_args$args; }
    location = /login/bootstrap5 { return 302 /login/bootstrap5/$is_args$args; }
    location ~ \.php(?:/|$) { return 404; }
    location /login/bootstrap5/ { try_files $uri $uri/ =404; }
    location / { return 404; }
}
