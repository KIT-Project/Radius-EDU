# Dedicated static captive portal listener; admin and API remain on port 443.
server {
    absolute_redirect off;
    listen 550 ssl;
    listen [::]:550 ssl;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name _;
    root /var/www/html;
    index index.html;

    # Only this restricted session-confirmation action is reachable from the portal.
    location = /cake4/rd_cake/radaccts/portal-session-status.json {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/cake4/rd_cake/webroot/index.php;
        fastcgi_param SCRIPT_NAME /cake4/rd_cake/webroot/index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location = / { return 302 /login/$is_args$args; }
    location = /login { return 302 /login/$is_args$args; }
    location /login/ { rewrite ^/login/(.*)$ /login/bootstrap5/$1 last; }
    location = /login/bootstrap5 { return 302 /login/bootstrap5/$is_args$args; }
    location ~ \.php(?:/|$) { return 404; }
    location /login/bootstrap5/ { try_files $uri $uri/ =404; }
    location / { return 404; }
}
